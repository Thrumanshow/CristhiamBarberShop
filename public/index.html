<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería de Chris Quiñonez | Reservas</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card: #181818;
      --accent: #f5c518;
      --text: #f0f0f0;
      --border: #2a2a2a;
      --success: #00ff9f;
      --error: #ff4444;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header { text-align: center; margin-bottom: 2rem; }
    h1 { color: var(--accent); margin-bottom: 0.2rem; }
    p.subtitle { color: #888; font-size: 0.9rem; margin: 0; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; margin-bottom: 0.4rem; font-size: 0.85rem; color: #ccc; }
    input, select, button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #000;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 1rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status-msg {
      margin-top: 1rem;
      padding: 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
    #status-msg.success { background: rgba(0,255,159,0.1); color: var(--success); border: 1px solid var(--success); }
    #status-msg.error { background: rgba(255,68,68,0.1); color: var(--error); border: 1px solid var(--error); }
    footer { margin-top: 3rem; font-size: 0.75rem; color: #555; text-align: center; }
  .business-location {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
      margin-top: 1.5rem;
      text-align: center;
    }
    .business-location h2 { color: var(--accent); font-size: 1rem; margin-top: 0; }
    .business-location address { font-style: normal; color: #ccc; font-size: 0.85rem; line-height: 1.6; }
    .business-location a.tel-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
    .map-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 8px;
      margin-top: 1rem;
      border: 1px solid var(--border);
    }
    .map-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    .maps-link {
      display: inline-block;
      margin-top: 0.8rem;
      color: var(--accent);
      font-size: 0.8rem;
      text-decoration: none;
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Barbería de Chris Quiñonez</h1>
    <p class="subtitle">Nodo Soberano de Reservas Edge</p>
  </header>

  <main class="card">
    <form id="booking-form">
      <div class="form-group">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
      </div>

      <div class="form-group">
        <label for="servicio">Servicio</label>
        <select id="servicio" name="servicio">
          <option value="Corte Tradicional ($10.00)">Corte Tradicional ($10.00)</option>
          <option value="Diseño de Barba ($7.00)">Diseño de Barba ($7.00)</option>
          <option value="Combo Corte + Barba ($15.00)">Combo Corte + Barba ($15.00)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fecha">Fecha y Hora</label>
        <input type="datetime-local" id="fecha" name="fecha" required>
      </div>

      <button type="submit" id="btn-submit">Confirmar Reserva</button>
      <div id="status-msg"></div>
    </form>
  </main>

  <section class="business-location" aria-labelledby="location-title">
    <h2 id="location-title">Visítanos</h2>
    <address>
      Avenida Tirabuzon 189 A<br>
      San Miguel, El Salvador
    </address>
    <p><a class="tel-link" href="tel:+50373110972">📞 +503 7311 0972</a></p>
    <div class="map-frame">
      <iframe
        title="Ubicación de Barbería de Chris Quiñonez"
        src="https://www.google.com/maps?q=13.4683796,-88.1927823&z=17&output=embed"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen>
      </iframe>
    </div>
    <a class="maps-link" href="https://www.google.com/maps/place/Barber%C3%ADa+de+Chris+Qui%C3%B1onez/@13.4683796,-88.1927823,17z" target="_blank" rel="noopener noreferrer">
      Abrir en Google Maps
    </a>
  </section>

  <footer>
    Powered by HormigasAIS Edge Infrastructure | San Miguel
  </footer>

  <script>
    const form = document.getElementById('booking-form');
    const btn = document.getElementById('btn-submit');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Procesando...';
      statusMsg.style.display = 'none';

      const payload = {
        nombre: document.getElementById('nombre').value,
        servicio: document.getElementById('servicio').value,
        fecha: document.getElementById('fecha').value
      };

      try {
        const res = await fetch('/api/reservar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (res.ok && data.status === 'success') {
          statusMsg.className = 'success';
          statusMsg.textContent = `¡Reserva confirmada! ID: ${data.data.id.substring(0,8)}`;
          statusMsg.style.display = 'block';
          form.reset();
        } else {
          throw new Error(data.error || 'Error en el servidor');
        }
      } catch (err) {
        statusMsg.className = 'error';
        statusMsg.textContent = `Error: ${err.message}`;
        statusMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirmar Reserva';
      }
    });
  </script>
</body>
</html>
